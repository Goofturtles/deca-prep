<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DECA Prep</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body class="login">
<main class="login-card">
  <svg class="logo lg" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" class="logo-bg"/><path d="M8.5 19.5l4.5-4.5 3.5 3.5 7-7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h1>DECA Prep</h1>
  <p class="muted">Team practice for the Marketing Cluster Exam.</p>
  <form id="login-form">
    <label class="field-l" for="pw">Team password</label>
    <input class="input" id="pw" type="password" autocomplete="current-password" required autofocus>
    <p id="err" class="err" role="alert"></p>
    <button class="btn primary block lg" type="submit">Enter</button>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
